name: Daily Digest

on:
  schedule:
    # 4/5 AM Central (UTC 10:00) — leaves ~2h for API backoff and GitHub queueing before 7 AM
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Optional: send only to this subscriber email'
        required: false
        type: string

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv
      
      - name: Sync dependencies
        working-directory: apps/pipeline
        run: uv sync
      
      - name: Run daily digest pipeline
        working-directory: apps/pipeline
        run: |
          args=()
          if [ -n "${{ inputs.recipient_email }}" ]; then
            args+=(--only-email "${{ inputs.recipient_email }}")
          fi
          uv run python -m src.main "${args[@]}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          SEMANTIC_SCHOLAR_REQUEST_INTERVAL_SECONDS: '2.5'
          SEMANTIC_SCHOLAR_MAX_RETRIES: '4'
